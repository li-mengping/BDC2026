# XGBoost pairwise 排序模型配置。
name: xgb_rank_pairwise
family: xgboost
enabled: true
output_dir: ./model/xgboost
num_boost_round: 200
features:
  input_window: 12
  feature_type: "39"
params:
  device: cuda
  booster: gbtree
  objective: rank:pairwise
  tree_method: hist
  max_depth: 5
  eta: 0.025
  subsample: 0.8
  colsample_bytree: 0.75
  min_child_weight: 30.0
  lambda: 18.0
  alpha: 0.2
  max_delta_step: 1.0
  seed: 42
  verbosity: 1
